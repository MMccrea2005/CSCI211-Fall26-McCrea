<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exercise 2: Packing List</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <h1>Packing List</h1>

  <form id="packForm">
    <input type="text" id="itemInput" placeholder="Add an item" autocomplete="off">
    <button type="submit">Add</button>
  </form>

  <p id="emptyMsg">Your list is empty</p>
  <ul id="packList"></ul>

  <button type="button" id="clearAll">Clear all</button>
</body>
</html>

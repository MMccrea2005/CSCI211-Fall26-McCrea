<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exercise 4: FAQ Accordion</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <h1>Trail FAQ</h1>

  <div class="faq">
    <button class="question">Are dogs allowed on the trails?</button>
    <div class="answer hidden">Yes, on a leash no longer than six feet.</div>

    <button class="question">Is there parking at the trailheads?</button>
    <div class="answer hidden">Yes. Lots fill up early on summer weekends.</div>

    <button class="question">Do I need a permit?</button>
    <div class="answer hidden">Day hikes don't. Overnight trips need a free permit.</div>

    <button class="question">When are the trails open?</button>
    <div class="answer hidden">From sunrise to sunset, May through October.</div>
  </div>
</body>
</html>

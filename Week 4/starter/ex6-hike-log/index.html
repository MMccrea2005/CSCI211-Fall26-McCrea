<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hike Log</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <h1>Hike Log</h1>

  <form id="hikeForm" novalidate>
    <label for="trail">Trail name</label>
    <input type="text" id="trail" name="trail" required>
    <p class="error"></p>

    <label for="miles">Miles</label>
    <input type="number" id="miles" name="miles"
           min="0.1" step="0.1" required>
    <p class="error"></p>

    <label for="difficulty">Difficulty</label>
    <select id="difficulty" name="difficulty">
      <option value="easy">Easy</option>
      <option value="moderate">Moderate</option>
      <option value="hard">Hard</option>
    </select>

    <label>
      <input type="checkbox" id="favorite" name="favorite"> Favorite
    </label>

    <button type="submit">Add hike</button>
  </form>

  <p id="summary"></p>
  <ul id="hikeList"></ul>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exercise 3: Reorder the Trails</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <h1>Trail Order</h1>
  <p>Put the trails in the order you want to hike them.</p>

  <ol id="trailList">
    <li class="trail">
      <span class="name">Bear Creek Loop</span>
      <button type="button" class="up">Up</button>
      <button type="button" class="down">Down</button>
    </li>
    <li class="trail">
      <span class="name">Pine Ridge Trail</span>
      <button type="button" class="up">Up</button>
      <button type="button" class="down">Down</button>
    </li>
    <li class="trail">
      <span class="name">Summit Lake Trail</span>
      <button type="button" class="up">Up</button>
      <button type="button" class="down">Down</button>
    </li>
    <li class="trail">
      <span class="name">Cedar Falls Trail</span>
      <button type="button" class="up">Up</button>
      <button type="button" class="down">Down</button>
    </li>
    <li class="trail">
      <span class="name">Elk Meadow Trail</span>
      <button type="button" class="up">Up</button>
      <button type="button" class="down">Down</button>
    </li>
  </ol>
</body>
</html>
